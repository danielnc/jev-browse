# jev-browse config: ~/.config/jev-browse/config.toml (or $JEV_BROWSE_CONFIG).
# Environment variables win over this file. Never put API keys here: keep them in the
# browser-harness agent-workspace .env. Generated by `python3 -m jev_browse config --example`.

[text]
# Where generated field values come from after a miss. auto = claude if the `claude` CLI is on PATH,
# else none. One of: auto, claude, codex, ollama, openai, none. Env: JEV_BROWSE_TEXT_BACKEND
# backend = "auto"
# Who answers when an ollama/openai backend fails its canary, is unreachable, or returns invalid
# output twice. auto = claude if the CLI is on PATH, else none (the miss hands back to you). One of:
# auto, claude, codex, none. Env: JEV_BROWSE_TEXT_FALLBACK
# fallback = "auto"
# When the text backend is asked: after a miss (default), eagerly on every page with fields, or
# never. One of: after_miss, eager, off. Env: JEV_BROWSE_SPECULATE_TEXT
# speculate = "after_miss"

[claude]
# Model for `claude -p`. Env: JEV_BROWSE_CLAUDE_MODEL
# model = "haiku"
# Keep one pre-started `claude` process per run (nothing is sent to it until a miss). Env:
# JEV_BROWSE_CLAUDE_POOL
# pool = true

[codex]
# Model for `codex exec -m`. Env: JEV_BROWSE_CODEX_MODEL
# model = "gpt-5.6-luna"
# Codex `model_reasoning_effort`. One of: minimal, low, medium, high. Env:
# JEV_BROWSE_CODEX_REASONING_EFFORT
# reasoning_effort = "low"

[ollama]
# Ollama server base URL (required for ollama). Env: JEV_BROWSE_OLLAMA_URL
# url = "http://127.0.0.1:11434"
# Ollama model tag. Env: JEV_BROWSE_OLLAMA_MODEL
# model = "qwen3:30b-a3b"
# Ollama `options.num_gpu`; 0 forces CPU. Unset = the server decides. Env: JEV_BROWSE_OLLAMA_NUM_GPU
# num_gpu = 0
# How long Ollama keeps the model loaded after a request. Env: JEV_BROWSE_OLLAMA_KEEP_ALIVE
# keep_alive = "30m"
# Ollama `think`. auto = off for qwen3, low for gpt-oss, unset otherwise. One of: auto, on, off,
# low, medium, high. Env: JEV_BROWSE_OLLAMA_THINK
# think = "auto"

[openai]
# OpenAI-compatible base URL, e.g. https://openrouter.ai/api/v1 (required for openai). Env:
# JEV_BROWSE_OPENAI_BASE_URL
# base_url = "https://openrouter.ai/api/v1"
# Model name at that endpoint (required). Env: JEV_BROWSE_OPENAI_MODEL
# model = "<model>"
# Name of the environment variable that holds the endpoint's API key (e.g. OPENROUTER_API_KEY). Env:
# JEV_BROWSE_OPENAI_API_KEY_ENV
# api_key_env = "JEV_BROWSE_OPENAI_API_KEY"

[canary]
# Known-answer check before trusting an ollama/openai backend. Env: JEV_BROWSE_CANARY
# enabled = true
# Seconds a passed canary is reused across processes. Env: JEV_BROWSE_CANARY_TTL_S
# ttl_healthy_s = 600
# Seconds a failed canary is reused across processes. Env: JEV_BROWSE_CANARY_TTL_UNHEALTHY_S
# ttl_unhealthy_s = 120

[jev]
# TypeSafe model or alias for decisions. Env: JEV_BROWSE_JEV_MODEL
# model = "jev-latest"

[run]
# fast_run default: max page actions. Env: JEV_BROWSE_MAX_ACTIONS
# max_actions = 30
# fast_run default: max TypeSafe requests. Env: JEV_BROWSE_MAX_REQUESTS
# max_requests = 60
# fast_run default: wall-clock budget (s). Env: JEV_BROWSE_TIMEOUT_S
# timeout_s = 90
# Do not print the JEV_BROWSE_RESULT line. Env: JEV_BROWSE_QUIET
# quiet = false

[values]
# Offer goal-derived value candidates to Jev before asking the text backend. Env:
# JEV_BROWSE_VALUE_CANDIDATES
# candidates = true
# Maximum number of fields that get a value question in one Jev request. Env: JEV_BROWSE_VALUE_HEADS
# heads = 6

[safety]
# Only these hosts (exact, or *.suffix). Unset or empty = all hosts. Env: JEV_BROWSE_ALLOWED_HOSTS
# allowed_hosts = []
# Replace the built-in commit-verb list (empty disables the verb check). Env:
# JEV_BROWSE_COMMIT_VERBS
# commit_verbs = []
# Add commit verbs to the list. Env: JEV_BROWSE_COMMIT_VERBS_EXTRA
# commit_verbs_extra = []
# Add label patterns that mark a field sensitive (never typed, read, or sent). Env:
# JEV_BROWSE_SENSITIVE_PATTERNS_EXTRA
# sensitive_patterns_extra = []

[mcp]
# The browser-harness command the MCP server runs each tool call through (a name on PATH or an
# absolute path). Env: JEV_BROWSE_HARNESS_COMMAND
# harness_command = "browser-harness"
# Seconds an MCP tool call waits before returning. A longer fast_run then returns its run_id for
# fast_run_status. Keep it below your MCP client's tool timeout (often 60 s). Env:
# JEV_BROWSE_MCP_WAIT_S
# wait_s = 45
