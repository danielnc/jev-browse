[project]
name = "jev-browse"
version = "0.1.0"
description = "Typed, fast browser sub-tasks for Claude Code on browser-harness, decided by TypeSafe Jev"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Only `jev-browse mcp` (jev_browse/mcp_server.py) imports it; the harness runtime stays stdlib-only.
mcp = ["mcp>=2.2,<3"]

[dependency-groups]
dev = ["pytest", "ruff", "mcp>=2.2,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".local"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
