<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Reserve</title>
<style>body{font:15px system-ui,sans-serif;margin:16px;color:#343e38}button{padding:10px 18px;border-radius:6px;border:1px solid #365b45;background:#365b45;color:white}</style>
</head><body>
<p id="what"></p>
<button type="button" id="reserve">Reserve</button>
<p id="status" role="status"></p>
<script>
  const property = new URLSearchParams(location.search).get("property") || "this stay";
  document.getElementById("what").textContent = `Reserve ${property} for 2 guests.`;
  document.getElementById("reserve").onclick = async () => {
    await fetch("/reserve?property=" + encodeURIComponent(property), { method: "POST" });
    document.getElementById("status").textContent = "Reservation confirmed.";
  };
</script>
</body></html>
