# OpenSSF Scorecard: supply-chain security checks, published to scorecard.dev (the README badge) and uploaded to
# code scanning. With publish_results, the job may use only approved actions, no run steps, and no workflow-level
# write permissions: https://github.com/ossf/scorecard-action#workflow-restrictions
name: Scorecard

on:
  push:
    branches: [main] # only the default branch is supported
  schedule:
    - cron: "30 1 * * 6" # Saturdays 01:30 UTC
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish_results: prove to scorecard.dev that this workflow produced the results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
