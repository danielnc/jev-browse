# Publishes jev-browse to PyPI when a v* tag is pushed, using PyPI Trusted Publishing (OIDC): there is no API
# token in this repository. One-time setup and the release steps: docs/releasing.md.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Check, build, and smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: The tag matches jev_browse.__version__
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import jev_browse; print(jev_browse.__version__)')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match jev_browse.__version__ $version"
            exit 1
          fi

      - name: Lint and test
        run: |
          uv sync --locked
          uv run ruff check .
          uv run pytest -q
          node --check jev_browse/snapshot.js

      - name: Build
        run: uv build

      - name: Smoke-test the wheel in a clean venv
        # Run outside the checkout so the import can only come from the installed wheel.
        working-directory: ${{ runner.temp }}
        env:
          DIST: ${{ github.workspace }}/dist
        run: |
          uv venv smoke
          uv pip install --python smoke/bin/python "$DIST"/*.whl
          smoke/bin/jev-browse --help
          smoke/bin/python -c 'from jev_browse import install; assert (install.SKILL_DIR / "SKILL.md").is_file(); assert install.CLI == "jev-browse"'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jev-browse/
    permissions:
      id-token: write # Trusted Publishing: PyPI exchanges this OIDC token for a short-lived upload token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
